<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Morphic Config Editor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="welcome-container">
        <header class="welcome-header">
            <h1>Morphic Config.json Builder</h1>
            <p>Create and manage configuration files for Morphic installations on computers at your organization</p>
        </header>
    
        <section>
            <h2>in 3 easy steps</h2>
            
            <div class="steps-container">
                <div class="step-box">
                    <div class="step-layout">
                        <div class="step-text"><span>Step</span></div>
                        <div class="step-number">1</div>
                    </div>
                    <h3>Configure Settings</h3>
                </div>
                
                <div class="step-arrow">→</div>
                
                <div class="step-box">
                    <div class="step-layout">
                        <div class="step-text"><span>Step</span></div>
                        <div class="step-number">2</div>
                    </div>
                    <h3>Add Custom Buttons</h3>
                </div>
                
                <div class="step-arrow">→</div>
                
                <div class="step-box">
                    <div class="step-layout">
                        <div class="step-text"><span>Step</span></div>
                        <div class="step-number">3</div>
                    </div>
                    <h3>Review & Download File</h3>
                </div>
            </div>
            
            <div class="button-container-welcome">
                <button class="btn-secondary" id="importSettingsButton">Import Settings</button>
                <button class="btn-primary" id="createNewButton">Create New File</button>
                <input type="file" id="configFileInput" accept=".json" style="display: none;">
            </div>
        </section>
    </main>
</body>
</html>
